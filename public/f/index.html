<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hour Tracker</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f4f4f5;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 360px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 15px; color: #a1a1aa; margin: 0 0 24px; }
  a.button {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: #f5c518;
    color: #16161a;
    font-weight: 700;
    text-decoration: none;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Opening Hour Tracker&hellip;</h1>
    <p>If nothing happens, tap below to get the app.</p>
    <a class="button" id="fallback" href="https://apps.apple.com/app/id6758329353">Get Hour Tracker</a>
  </div>
  <script>
    (function () {
      var slug = decodeURIComponent(
        window.location.pathname.replace(/^\/f\/?/, "")
      );
      if (slug) {
        var scheme =
          "com.googleusercontent.apps.883698344524-mqmpr0spvoqu758103dg63297a4u8gqq://add-friend?u=" +
          encodeURIComponent(slug);
        window.location.href = scheme;
      }
    })();
  </script>
</body>
</html>
